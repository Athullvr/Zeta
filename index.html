<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ETERNAL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="frame" aria-label="ETERNAL, a procedural gothic-romantic cinematic poem in five acts">
    <canvas id="c" aria-hidden="true"></canvas>
    <div id="text"></div>
  </main>

  <section id="controls" aria-label="Film playback controls" hidden>
    <div class="transport-controls">
      <button id="play-film" type="button">Play film</button>
      <button id="pause-film" type="button">Pause</button>
      <button id="resume-film" type="button" disabled>Resume</button>
      <button id="restart-film" type="button">Restart</button>
      <label class="silent-option"><input id="silent-preview" type="checkbox"> Silent preview</label>
    </div>
    <div class="timeline-controls">
      <label for="film-seek">Film position</label>
      <input id="film-seek" type="range" min="0" max="168.15" step="0.1" value="0">
      <output id="film-time" for="film-seek">0:00 / 2:48</output>
    </div>
    <div class="sound-controls">
      <label for="music-volume">Music volume</label>
      <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.72">
      <button id="mute-music" type="button" aria-pressed="false">Mute</button>
      <button id="test-audio" type="button" title="Play a short tone through the browser's native audio output">TEST AUDIO (diagnostic)</button>
      <span id="audio-status" role="status" aria-live="polite">Checking for the local soundtrack…</span>
    </div>
    <details id="audio-debug">
      <summary>Temporary audio diagnostics</summary>
      <pre id="audio-diagnostics" aria-live="polite">Waiting for audio diagnostics…</pre>
      <span id="test-audio-status" role="status" aria-live="polite">Test tone has not been played.</span>
    </details>
  </section>

  <section id="fail" hidden role="alert">
    <h1></h1>
    <p></p>
    <pre></pre>
  </section>
  <noscript><p class="noscript">ETERNAL is drawn live by JavaScript and WebGL2. Please enable JavaScript.</p></noscript>

  <script src="src/util.js"></script>
  <script src="src/director.js"></script>
  <script src="src/script.js"></script>
  <script src="src/scenes/opening.js"></script>
  <script src="src/scenes/act1.js"></script>
  <script src="src/scenes/act2.js"></script>
  <script src="src/scenes/act3.js"></script>
  <script src="src/scenes/storm.js"></script>
  <script src="src/scenes/act4.js"></script>
  <script src="src/scenes/act5.js"></script>
  <script src="src/scenes/film.js"></script>
  <script src="src/governor.js"></script>
  <script src="src/bench.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/shaders-common.js"></script>
  <script src="src/shaders-interior.js"></script>
  <script src="src/shaders-terrace.js"></script>
  <script src="src/shaders.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/overlay.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
